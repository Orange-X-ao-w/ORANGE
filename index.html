        .music-btn:active { transform: scale(0.95); }
        .music-btn svg { width: 24px; height: 24px; }

        @keyframes music-spin { to { transform: rotate(360deg); } }

        .music-btn .slash { display: block; }

        .music-btn .waves {

        .music-btn.playing .waves:nth-of-type(2) { animation-delay: 0.7s; }

        @keyframes music-ripple {

        .music-tip {

            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        .music-tip.show { opacity: 1; transform: none; }

        @media (max-width: 420px) {
            .music-tip { right: auto; left: 20px; bottom: 88px; }
        }
    </style>

<!-- ====== 背景音乐逻辑 ====== -->
<script>
    (function () {
        var audio    = document.getElementById('bgm');
        var btn      = document.getElementById('musicBtn');
        var tip      = document.getElementById('musicTip');
        var started  = false;
        var tipTimer = null;

        function syncUI() {
            btn.classList.toggle('playing', !audio.paused && !audio.ended);
        }

        function showTip(text, autoHide) {
            tip.textContent = text;
            tip.classList.add('show');
            clearTimeout(tipTimer);
            if (autoHide !== false) {
                tipTimer = setTimeout(function () { tip.classList.remove('show'); }, 3200);
            }
        }

        function removeOnce() {
            document.removeEventListener('click', onFirstInteract);
            document.removeEventListener('touchstart', onFirstInteract);
            document.removeEventListener('keydown', onFirstInteract);
        }

        function tryPlay() {
            audio.volume = 0.6;
            var p = audio.play();
            if (p && typeof p.catch === 'function') {
                p.then(function () {
                    started = true; syncUI(); tip.classList.remove('show'); removeOnce();
                }).catch(function () {
                    showTip('点击页面任意处即可播放音乐 ♪');
                });
            } else {
                started = true; syncUI(); removeOnce();
            }
        }

        function onFirstInteract() { if (!started) { tryPlay(); } }

        document.addEventListener('click', onFirstInteract);
        document.addEventListener('touchstart', onFirstInteract);
        document.addEventListener('keydown', onFirstInteract);

        btn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (audio.paused) {
                audio.volume = 0.6;
                audio.play().then(function () {
                    started = true; syncUI(); removeOnce(); tip.classList.remove('show');
                }).catch(function () {
                    showTip('音乐文件未找到，请确认 mp3 与网页在同一目录');
                });
            } else {
                audio.pause(); syncUI(); showTip('已暂停 ♪');
            }
        });

        btn.addEventListener('mouseenter', function () {
            if (!started) { showTip('点击开启背景音乐 ♪'); }
        });

        audio.addEventListener('error', function () {
            showTip('未找到音乐文件：请确认 mp3 与本网页在同一目录');
        });

        audio.addEventListener('play', syncUI);
        audio.addEventListener('pause', syncUI);

        window.addEventListener('load', tryPlay);
    })();
</script>

<!-- ====== OAuth 2.0 登录逻辑 ====== -->
<script>
(function () {
    'use strict';

    /* ================= 配置 ================= */
    var CONFIG = {
        CLIENT_ID:     'client_7AY4pmpO',
        CLIENT_SECRET: 'secret_JAooMGM9yZnlokypoPf0U1Cj',
        AUTHORIZE_URL: 'https://auth.7e.ink/oauth/authorize',
        TOKEN_URL:     'https://api-auth.7e.ink/oauth/token',
        USERINFO_URL:  'https://api-auth.7e.ink/oauth/userinfo',
        SCOPE:         'profile',
        // 回调地址：默认用当前页面地址（需与认证后台登记的白名单一致）
        // 若后台登记的是 https://orange-6lw.pages.dev/ ，请把下面这行改成固定值
        REDIRECT_URI:  location.origin + location.pathname
    };

    var LS_TOKEN = 'orange_access_token';
    var LS_USER  = 'orange_user';

    /* ================= 工具 ================= */
    var $ = function (id) { return document.getElementById(id); };

    function status(msg, type) {
        var el = $('authStatus');
        el.textContent = msg || '';
        el.className = 'login-note' + (type ? ' ' + type : '');
    }

    function randomStr(n) {
        var arr = new Uint8Array(n);
        (window.crypto || window.msCrypto).getRandomValues(arr);
        return Array.prototype.map.call(arr, function (b) {
            return ('0' + b.toString(16)).slice(-2);
        }).join('');
    }

    function getToken() { return localStorage.getItem(LS_TOKEN); }
    function setToken(t) { localStorage.setItem(LS_TOKEN, t); }
    function clearToken() { localStorage.removeItem(LS_TOKEN); localStorage.removeItem(LS_USER); }

    /* ================= 1. 发起登录 ================= */
    function startLogin() {
        var state = randomStr(16);
        sessionStorage.setItem('oauth_state', state);

        var url = CONFIG.AUTHORIZE_URL +
            '?client_id='     + encodeURIComponent(CONFIG.CLIENT_ID) +
            '&redirect_uri='  + encodeURIComponent(CONFIG.REDIRECT_URI) +
            '&response_type=code' +
            '&scope='         + encodeURIComponent(CONFIG.SCOPE) +
            '&state='         + encodeURIComponent(state);

        location.href = url;
    }

    /* ================= 2. 回调：用 code 换 token ================= */
    async function exchangeToken(code) {
        var body = new URLSearchParams({
            grant_type:    'authorization_code',
            code:          code,
            client_id:     CONFIG.CLIENT_ID,
            client_secret: CONFIG.CLIENT_SECRET,
            redirect_uri:  CONFIG.REDIRECT_URI
        });

        var res = await fetch(CONFIG.TOKEN_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: body
        });

        var data = await res.json().catch(function () { return {}; });
        if (!res.ok || !data.access_token) {
            throw new Error(data.error_description || data.error || ('换取 token 失败（HTTP ' + res.status + '）'));
        }
        return data.access_token;
    }

    /* ================= 3. 用 token 获取用户信息 ================= */
    async function fetchUserInfo(token) {
        var res = await fetch(CONFIG.USERINFO_URL, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.status === 401 || res.status === 403) {
            var e = new Error('token 已失效'); e.invalid = true; throw e;
        }
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(data.error_description || ('获取用户信息失败（HTTP ' + res.status + '）'));
        return data;
    }

    /* ================= 渲染 ================= */
    function renderUser(user) {
        $('loginSection').style.display = 'none';
        $('logoutBtn').style.display   = 'inline-block';
        $('userInfo').style.display    = 'flex';

        var name = user.display_name || user.nickname || user.username || ('用户' + (user.user_id || ''));
        $('userName').textContent = name;
        $('userUuid').textContent = 'UID: ' + (user.user_id || '-') + (user.username ? ' · @' + user.username : '');

        var meta = [];
        if (user.email) {
            meta.push(user.email + (user.email_verified ? ' <span class="verified">✓ 已验证</span>' : ' (未验证)'));
        }
        $('userMeta').innerHTML = meta.join('　');

        var avatar = $('userAvatar');
        if (user.avatar_url) {
            avatar.innerHTML = '';
            var img = new Image();
            img.src = user.avatar_url;
            img.alt = name;
            img.onerror = function () {
                avatar.innerHTML = '';
                avatar.textContent = name.charAt(0).toUpperCase();
            };
            avatar.appendChild(img);
        } else {
            avatar.textContent = name.charAt(0).toUpperCase();
        }
    }

    function renderGuest() {
        $('loginSection').style.display = 'block';
        $('logoutBtn').style.display    = 'none';
        $('userInfo').style.display     = 'none';
    }

    /* ================= 退出登录 ================= */
    function logout() {
        clearToken();
        renderGuest();
        status('已退出登录');
    }

    /* ================= 主流程 ================= */
    async function main() {
        $('loginBtn').addEventListener('click', function (e) { e.preventDefault(); startLogin(); });
        $('logoutBtn').addEventListener('click', function (e) { e.preventDefault(); logout(); });

        var params = new URLSearchParams(location.search);
        var code  = params.get('code');
        var state = params.get('state');
        var error = params.get('error');

        // 授权被拒绝 / 出错
        if (error) {
            renderGuest();
            status('授权失败：' + (params.get('error_description') || error), 'error');
            history.replaceState({}, '', location.pathname);
            return;
        }

        // 回调：带 code 回来
        if (code) {
            if (state !== sessionStorage.getItem('oauth_state')) {
                renderGuest();
                status('state 校验失败，已中止（可能是 CSRF 攻击）', 'error');
                history.replaceState({}, '', location.pathname);
                return;
            }
            sessionStorage.removeItem('oauth_state');
            history.replaceState({}, '', location.pathname); // 抹掉地址栏里的 code

            status('正在登录…');
            try {
                var token = await exchangeToken(code);
                setToken(token);
                var user  = await fetchUserInfo(token);
                localStorage.setItem(LS_USER, JSON.stringify(user));
                renderUser(user);
                status('登录成功', 'ok');
            } catch (err) {
                clearToken();
                renderGuest();
                status(err.message + '（若浏览器报 CORS 错误，需由后端代理换取 token）', 'error');
            }
            return;
        }

        // 已登录：直接拉取用户信息
        var token = getToken();
        if (token) {
            status('正在读取登录状态…');
            try {
                var u = await fetchUserInfo(token);
                renderUser(u);
                status('');
            } catch (err) {
                clearToken();
                renderGuest();
                status(err.invalid ? '登录已过期，请重新登录' : (err.message + '（若浏览器报 CORS 错误，需由后端代理换取 token）'), 'error');
            }
        } else {
            renderGuest();
        }
    }

    /* 预留按钮：填入 data-api 后即可自动请求 */
    document.querySelectorAll('.btn.disabled[data-api]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var api = btn.getAttribute('data-api');
            if (!api) { alert('该按钮为预留位，请在 data-api 中填入接口地址后启用。'); return; }
            fetch(api, { headers: { 'Authorization': 'Bearer ' + getToken() } })
                .then(function (r) { return r.json(); })
                .then(function (d) { console.log(d); })
                .catch(function (e) { console.error(e); });
        });
    });

    main();
})();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORANGE橙子科技</title>
    <style>
        /* 全局设置：白色背景、深色字体 */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
            text-align: center;
        }

        /* 主容器 */
        .container {
            width: 90%;
            max-width: 600px;
            padding: 40px 20px;
        }

        /* 顶部标题图片区域 - 修改为726:289比例 */
        .header-image {
            width: 100%;
            aspect-ratio: 726 / 289; /* 保持726×289比例 */
            background-color: #f5f5f7;
            border-radius: 16px;
            margin-bottom: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 1px dashed #ddd;
        }

        .header-image img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 保持比例，完整显示 */
            object-position: center;
        }

        /* 按钮网格布局 */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 60px;
        }

        /* 通用按钮样式 */
        .btn {
            padding: 25px 10px;
            background-color: #f5f5f7;
            border: none;
            border-radius: 12px;
            color: #333;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 激活按钮的特效 */
        .btn.active {
            background-color: #000000;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn.active:hover {
            transform: translateY(-5px);
            background-color: #333;
        }

        /* 未开放按钮的样式 */
        .btn.disabled {
            background-color: #f5f5f7;
            color: #bbb;
            cursor: not-allowed;
            border: 1px solid #eee;
        }

        /* 底部版权信息 */
        .footer {
            font-size: 14px;
            color: #999;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 顶部图片 -->
        <div class="header-image">
            <!-- 这里直接引用了 ORANGE.png -->
            <img src="ORANGE.png" alt="ORANGE Logo">
        </div>

        <!-- 2. 中间四个按钮 -->
        <div class="button-grid">
            <!-- 按钮 1: ORANUP (已激活，跳转链接) -->
            <a href="https://orange-6lw.pages.dev/1" class="btn active" target="_blank">
                ORANUP
            </a>
            
            <!-- 按钮 2: 暂未开放 -->
            <button class="btn disabled" onclick="alert('暂未开放')">
                暂未开放
            </button>
            
            <!-- 按钮 3: 暂未开放 -->
            <button class="btn disabled" onclick="alert('暂未开放')">
                暂未开放
            </button>
            
            <!-- 按钮 4: 暂未开放 -->
            <button class="btn disabled" onclick="alert('暂未开放')">
                暂未开放
            </button>
        </div>

        <!-- 3. 底部版权 -->
        <div class="footer">
            © ORANGE 2026 版权所有 Zcloud提供技术支持
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORANGE橙子科技</title>
    <link rel="icon" type="image/png" href="ORDMnew.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 40px 20px;
        }

        /* 顶部 LOGO */
        .header-image {
            width: 100%;
            aspect-ratio: 726 / 289;
            margin-bottom: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .header-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }

        /* 用户信息区（登录后显示） */
        .user-info {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .user-name {
            font-size: 22px;
            font-weight: bold;
        }

        .user-uuid {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        /* 按钮网格 */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 60px;
        }

        .btn {
            padding: 25px 10px;
            background-color: #f5f5f7;
            border: none;
            border-radius: 12px;
            color: #333;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .btn.active {
            background-color: #000000;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn.active:hover {
            transform: translateY(-5px);
            background-color: #333;
        }

        .btn.disabled {
            background-color: #f5f5f7;
            color: #bbb;
            cursor: not-allowed;
            border: 1px solid #eee;
        }

        .new-tag {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 10px;
            color: #ffffff;
            background-color: #ff4757;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: normal;
            letter-spacing: 0.5px;
        }

        /* 登录区域 */
        .login-section {
            margin-top: 40px;
        }

        .login-note {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }

        /* 退出登录按钮 */
        .logout-btn {
            display: none;
            margin-top: 20px;
            padding: 12px 30px;
            background-color: #f5f5f7;
            border: 1px solid #ddd;
            border-radius: 12px;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .logout-btn:hover {
            background-color: #eee;
        }

        /* 底部版权 */
        .footer {
            font-size: 14px;
            color: #999;
            letter-spacing: 1px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 顶部 LOGO -->
    <div class="header-image">
        <img src="ORANGE.png" alt="ORANGE Logo">
    </div>

    <!-- 用户信息（登录后显示） -->
    <div class="user-info" id="userInfo">
        <div class="user-avatar" id="userAvatar">U</div>
        <div>
            <div class="user-name" id="userName">用户名</div>
            <div class="user-uuid" id="userUuid">UUID</div>
        </div>
    </div>

    <!-- 主按钮区 -->
    <div class="button-grid">
        <a href="https://orange-6lw.pages.dev/1" class="btn active" target="_blank">
            ORANUP
        </a>

        <a href="https://orange-6lw.pages.dev/2" class="btn active" target="_blank">
            作品
        </a>

        <a href="https://orange-6lw.pages.dev/" class="btn active" target="_blank">
            刷新
        </a>

        <a href="https://ordream.pages.dev/" class="btn active" target="_blank">
            ORDM术力口
            <span class="new-tag">有跟新</span>
        </a>
    </div>

    <!-- 登录按钮（未登录时显示） -->
    <div class="login-section" id="loginSection">
        <a href="https://orange-x-ao-w.github.io/zpl/ORANGETYSFRZ" class="btn active" target="_blank">
            登录
        </a>
        <div class="login-note">此站点现已关闭，跳转后为空页</div>
    </div>

    <!-- 退出登录（登录后显示） -->
    <a href="#" class="logout-btn" id="logoutBtn">预留（原退登）</a>

    <!-- 底部版权 -->
    <div class="footer">
        © ORDM(ORANGE) 2026 版权所有 Zcloud提供技术支持<br>
        <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="158.5" height="25" role="img" aria-label="萌ICP备: 20262014号" style="margin-top:8px;">
            <a xlink:href="https://icp.gov.moe/?keyword=20262014" target="_blank">
            <title>萌ICP备: 20262014号</title>
        <defs>
            <clipPath id="rounded-corner">
                <rect width="158.5" height="25" rx="3" ry="3"/>
            </clipPath>
        </defs>
        <g shape-rendering="crispEdges" clip-path="url(#rounded-corner)">
            <rect width="65.5" height="25" fill="#92400e"/>
            <rect x="65.5" width="93" height="25" fill="#f59e0b"/>
        </g>
        <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="130">
            <text x="327.5" y="170" transform="scale(.1)" fill="#fff" textLength="505">萌ICP备</text>
            <text x="1120" y="170" transform="scale(.1)" fill="#fff" textLength="805">20262014号</text>
        </g>
            </a>
        </svg>
    </div>

</div>

<script>
    // ========== 配置 ==========
    const AUTH_API_BASE = 'http://free.frpee.top:19148';

    // ========== 工具函数 ==========
    function getQueryParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
    }

    function removeQueryParam(name) {
        const url = new URL(window.location);
        url.searchParams.delete(name);
        window.history.replaceState({}, '', url);
    }

    // ========== 获取用户信息 ==========
    async function fetchUserInfo(uuid) {
        try {
            const token = localStorage.getItem('orange_token_' + uuid);

            if (token) {
                const res = await fetch(`${AUTH_API_BASE}/api/userinfo?token=${encodeURIComponent(token)}`);
                const data = await res.json();
                if (data.success && data.user) {
                    return data.user;
                }
            }

            return {
                username: '用户' + uuid.substring(0, 6),
                uuid: uuid,
                email: null,
                phone: null
            };
        } catch (err) {
            console.error('获取用户信息失败:', err);
            return {
                username: '用户' + uuid.substring(0, 6),
                uuid: uuid,
                email: null,
                phone: null
            };
        }
    }

    // ========== 渲染个人主页 ==========
    function renderUserProfile(user) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'inline-block';
        document.getElementById('userInfo').style.display = 'flex';

        document.getElementById('userName').textContent = user.username || '未知用户';
        document.getElementById('userUuid').textContent = user.uuid || '';
        const avatarText = user.username ? user.username.charAt(0).toUpperCase() : 'U';
        document.getElementById('userAvatar').textContent = avatarText;
    }

    // ========== 退出登录 ==========
    document.getElementById('logoutBtn').addEventListener('click', async function(e) {
        e.preventDefault();

        const uuid = getQueryParam('uuid');
        const token = localStorage.getItem('orange_token_' + uuid);

        if (token) {
            try {
                await fetch(`${AUTH_API_BASE}/api/logout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });
            } catch (err) {
                console.error('退出登录请求失败:', err);
            }
            localStorage.removeItem('orange_token_' + uuid);
        }

        removeQueryParam('uuid');
        location.reload();
    });

    // ========== 主逻辑 ==========
    (async function main() {
        const uuid = getQueryParam('uuid');

        if (uuid) {
            const user = await fetchUserInfo(uuid);
            renderUserProfile(user);
        }
    })();
</script>

</body>
</html>

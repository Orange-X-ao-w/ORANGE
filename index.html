<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORANGE橙子科技</title>
    <style>
        /* ... 你原有的CSS保持不变 ... */
        body { margin: 0; padding: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #333; text-align: center; }
        .container { width: 90%; max-width: 600px; padding: 40px 20px; }
        .header-image { width: 100%; aspect-ratio: 726 / 289; background-color: #f5f5f7; border-radius: 16px; margin-bottom: 50px; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 1px dashed #ddd; position: relative; }
        .header-image img { width: 100%; height: 100%; object-fit: contain; object-position: center; }
        .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 60px; }
        .btn { padding: 25px 10px; background-color: #f5f5f7; border: none; border-radius: 12px; color: #333; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; text-decoration: none; display: flex; justify-content: center; align-items: center; position: relative; }
        .btn.active { background-color: #000000; color: #ffffff; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
        .btn.active:hover { transform: translateY(-5px); background-color: #333; }
        .btn.disabled { background-color: #f5f5f7; color: #bbb; cursor: not-allowed; border: 1px solid #eee; }
        .new-tag { position: absolute; top: 8px; right: 8px; font-size: 10px; color: #ffffff; background-color: #ff4757; padding: 2px 6px; border-radius: 4px; font-weight: normal; letter-spacing: 0.5px; }
        
        /* 新增：用户信息样式 */
        .user-info { display: none; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .user-name { font-size: 18px; font-weight: bold; }
        
        /* 登录小字样式 */
        .login-note { font-size: 12px; color: #999; margin-top: 8px; }
        
        .footer { font-size: 14px; color: #999; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-image">
            <img src="ORANGE.png" alt="ORANGE Logo">
        </div>

        <!-- 用户信息展示区（登录后显示） -->
        <div class="user-info" id="userInfo">
            <div class="user-avatar" id="userAvatar">U</div>
            <div class="user-name" id="userName">用户名</div>
        </div>

        <div class="button-grid">
            <a href="https://orange-6lw.pages.dev/1" class="btn active" target="_blank">ORANUP</a>
            <a href="https://orange-6lw.pages.dev/1" class="btn active" target="_blank">作品</a>
            <a href="https://orange-6lw.pages.dev/" class="btn active" target="_blank">
                刷新
                <span class="new-tag">new</span>
            </a>
            <button class="btn disabled" onclick="alert('暂未开放')">暂未开放</button>
        </div>

        <!-- 登录/个人中心 按钮 -->
        <div style="margin-bottom: 40px;">
            <a href="http://free.frpee.top:19148/" class="btn active" style="display: inline-block; padding: 12px 30px; font-size: 16px;" id="authButton">
                登录
            </a>
            <div class="login-note">此站点不一定开放</div>
        </div>

        <div class="footer">
            © ORANGE 2026 版权所有 Zcloud提供技术支持
        </div>
    </div>

    <script>
        // 1. 检查URL中是否有 UUID 参数
        const urlParams = new URLSearchParams(window.location.search);
        const uuid = urlParams.get('uuid');
        const token = urlParams.get('token'); // 假设认证服务器会通过 token 参数返回

        // 2. 如果有 Token，说明是从认证服务器跳转回来的
        if (token) {
            handleLogin(token);
        } else if (uuid) {
            // 如果只有 UUID（可能是直接访问个人主页链接），尝试获取用户信息
            fetchUserInfoByUuid(uuid);
        }

        // 处理登录逻辑
        async function handleLogin(userToken) {
            try {
                // 调用 API 验证 token 并获取用户信息
                // 注意：这里需要解决跨域问题，或者使用你自己的后端做代理
                const apiUrl = `http://free.frpee.top:19148/api/verify?token=${userToken}`;
                
                // 由于跨域限制，实际部署时建议通过自己的后端转发
                // 这里仅作演示逻辑
                console.log('验证Token:', userToken);
                
                // 模拟API返回成功
                // 实际应改为: const response = await fetch(apiUrl);
                // const data = await response.json();
                
                // 假设验证成功，获取到 uuid
                // if (data.success) {
                //     const userUuid = data.uuid;
                //     // 重定向到带UUID的主页
                //     window.location.href = `/?uuid=${userUuid}`;
                // }
                
                // 演示：假设验证通过，直接跳转
                // 你需要根据实际API返回调整这里
                alert('登录成功！Token: ' + userToken);
                
            } catch (error) {
                console.error('登录验证失败:', error);
            }
        }

        // 根据UUID获取用户信息并显示个人主页
        async function fetchUserInfoByUuid(uuid) {
            try {
                // 这里需要你的后端提供根据UUID获取用户信息的接口
                // 或者通过verify接口间接获取
                console.log('UUID:', uuid);
                
                // 显示个人主页样式
                document.getElementById('userInfo').style.display = 'flex';
                document.getElementById('userName').textContent = '用户 ' + uuid.substring(0, 8);
                document.getElementById('authButton').textContent = '个人中心';
                document.getElementById('authButton').href = 'http://free.frpee.top:19148/';
                
            } catch (error) {
                console.error('获取用户信息失败:', error);
            }
        }

        // 3. 登录按钮点击事件
        document.getElementById('authButton').addEventListener('click', function(e) {
            if (uuid) {
                // 如果已登录，跳转到个人中心
                this.href = 'http://free.frpee.top:19148/';
            } else {
                // 未登录，跳转到登录页
                // 可以在跳转时携带当前页面的回调地址
                const callbackUrl = encodeURIComponent(window.location.href);
                this.href = `http://free.frpee.top:19148/?redirect=${callbackUrl}`;
            }
        });
    </script>
</body>
</html>

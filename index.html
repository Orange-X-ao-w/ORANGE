<html lang="zh-CN">
<head>

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 40px 20px;
        }

        /* 顶部 LOGO */
        .header-image {
            width: 100%;
            aspect-ratio: 726 / 289;
            margin-bottom: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .header-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }

        /* 用户信息区（登录后显示） */
        .user-info {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .user-name {
            font-size: 22px;
            font-weight: bold;
        }

        .user-uuid {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        /* 按钮网格 */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 60px;
        }

        .btn {
            padding: 25px 10px;
            background-color: #f5f5f7;
            border: none;
            border-radius: 12px;
            color: #333;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .btn.active {
            background-color: #000000;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn.active:hover {
            transform: translateY(-5px);
            background-color: #333;
        }

        .btn.disabled {
            background-color: #f5f5f7;
            color: #bbb;
            cursor: not-allowed;
            border: 1px solid #eee;
        }

        .new-tag {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 10px;
            color: #ffffff;
            background-color: #ff4757;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: normal;
            letter-spacing: 0.5px;
        }

        /* 登录区域 */

            margin-top: 40px;
        }

        .login-note {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }

        /* 退出登录按钮 */
        .logout-btn {
            display: none;
            margin-top: 20px;
            padding: 12px 30px;
            background-color: #f5f5f7;
            border: 1px solid #ddd;
            border-radius: 12px;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .logout-btn:hover {
            background-color: #eee;
        }

        /* 底部版权 */
        .footer {
            font-size: 14px;
            color: #999;
            letter-spacing: 1px;
            margin-top: 40px;
        }

        /* 底部徽章行：站点图标 + 萌ICP + 异次元之旅 */
        .badges {
            margin-top: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        .badges > svg {
            display: block;
            margin-top: 0;
        }

        .site-icon {
            display: inline-flex;
            align-items: center;
            line-height: 0;
        }

        .site-icon img {
            display: block;
            width: auto;
            height: 36px;
            border-radius: 3px;
            transition: opacity 0.3s ease;
        }

        .site-icon:hover img {
            opacity: 0.8;
        }

        .travel-badge {
            display: inline-flex;
            align-items: center;
            line-height: 0;
        }

        .travel-badge img {
            display: block;
            width: auto;
            height: 36px;
            border-radius: 3px;
            transition: opacity 0.3s ease;
        }

        .travel-badge:hover img {
            opacity: 0.8;
        }

        /* ===== 右下角背景音乐按钮（新增） ===== */
        .music-btn {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 9999;
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            padding: 0;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 50%;
            cursor: pointer;
            color: #333333;
            background-color: #f5f5f7;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
            transition: transform 0.18s ease, background-color 0.25s ease, color 0.25s ease;
        }

        .music-btn:hover {
            transform: scale(1.07);
            background-color: #ececed;
        }

        .music-btn:active {
            transform: scale(0.95);
        }

        .music-btn svg {
            width: 24px;
            height: 24px;
        }

        /* 播放中：反色 + 唱片旋转 */
        .music-btn.playing {
            background-color: #000000;
            color: #ffffff;
            border-color: #000000;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .music-btn.playing .disc {
            animation: music-spin 3.2s linear infinite;
        }

        @keyframes music-spin {
            to { transform: rotate(360deg); }
        }

        /* 暂停时显示斜杠，播放时隐藏 */
        .music-btn .slash { display: block; }
        .music-btn.playing .slash { display: none; }

        /* 播放时的扩散声波圈 */
        .music-btn .waves {
            display: none;
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.35);
        }

        .music-btn.playing .waves {
            display: block;
            animation: music-ripple 2s ease-out infinite;
        }

        .music-btn.playing .waves:nth-of-type(2) {
            animation-delay: 0.7s;
        }

        @keyframes music-ripple {
            0%   { transform: scale(1);   opacity: 0.6; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* 提示气泡 */
        .music-tip {
            position: fixed;
            right: 88px;
            bottom: 38px;
            z-index: 9999;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background-color: rgba(255, 255, 255, 0.94);
            color: #666;
            font-size: 12.5px;
            white-space: nowrap;
            opacity: 0;
            transform: translateX(8px);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        .music-tip.show {
            opacity: 1;
            transform: none;
        }

        @media (max-width: 420px) {
            .music-tip {
                right: auto;
                left: 20px;
                bottom: 88px;
            }
        }
    </style>
</head>

<!-- ===== 背景音乐（新增）：mp3 与本文件放在同一目录 ===== -->
<audio id="bgm" src="月が綺麗ねと言われたい！-柿崎ユウ_.mp3" loop preload="auto"></audio>

<button class="music-btn" id="musicBtn" type="button" aria-label="播放/暂停背景音乐" title="播放/暂停背景音乐">
    <span class="waves"></span>
    <span class="waves"></span>
    <svg class="disc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 18V6l10-3v12"/>
        <circle cx="6.5" cy="18" r="2.6"/>
        <circle cx="16.5" cy="15" r="2.6"/>
        <line class="slash" x1="3" y1="3" x2="21" y2="21"/>
    </svg>
</button>
<div class="music-tip" id="musicTip">点击页面任意处即可播放音乐 ♪</div>

<script>
    (function () {
        var audio    = document.getElementById('bgm');
        var btn      = document.getElementById('musicBtn');
        var tip      = document.getElementById('musicTip');
        var started  = false;
        var tipTimer = null;

        function syncUI() {
            btn.classList.toggle('playing', !audio.paused && !audio.ended);
        }

        function showTip(text, autoHide) {
            tip.textContent = text;
            tip.classList.add('show');
            clearTimeout(tipTimer);
            if (autoHide !== false) {
                tipTimer = setTimeout(function () { tip.classList.remove('show'); }, 3200);
            }
        }

        function removeOnce() {
            document.removeEventListener('click', onFirstInteract);
            document.removeEventListener('touchstart', onFirstInteract);
            document.removeEventListener('keydown', onFirstInteract);
        }

        function tryPlay() {
            audio.volume = 0.6;
            var p = audio.play();
            if (p && typeof p.catch === 'function') {
                p.then(function () {
                    started = true;
                    syncUI();
                    tip.classList.remove('show');
                    removeOnce();
                }).catch(function () {
                    showTip('点击页面任意处即可播放音乐 ♪');
                });
            } else {
                started = true;
                syncUI();
                removeOnce();
            }
        }

        function onFirstInteract() {
            if (!started) { tryPlay(); }
        }

        document.addEventListener('click', onFirstInteract);
        document.addEventListener('touchstart', onFirstInteract);
        document.addEventListener('keydown', onFirstInteract);

        btn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (audio.paused) {
                audio.volume = 0.6;
                audio.play().then(function () {
                    started = true;
                    syncUI();
                    removeOnce();
                    tip.classList.remove('show');
                }).catch(function () {
                    showTip('音乐文件未找到，请确认 mp3 与网页在同一目录');
                });
            } else {
                audio.pause();
                syncUI();
                showTip('已暂停 ♪');
            }
        });

        btn.addEventListener('mouseenter', function () {
            if (!started) { showTip('点击开启背景音乐 ♪'); }
        });

        audio.addEventListener('error', function () {
            showTip('未找到音乐文件：请确认 mp3 与本网页在同一目录');
        });

        audio.addEventListener('play', syncUI);
        audio.addEventListener('pause', syncUI);

        window.addEventListener('load', tryPlay);
    })();
</script>

<script>
    // ========== 配置 ==========
    const AUTH_API_BASE = 'http://free.frpee.top:19148';

    // ========== 工具函数 ==========
    function getQueryParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
    }

    function removeQueryParam(name) {
        const url = new URL(window.location);
        url.searchParams.delete(name);
        window.history.replaceState({}, '', url);
    }

    // ========== 获取用户信息 ==========
    async function fetchUserInfo(uuid) {
        try {
            const token = localStorage.getItem('orange_token_' + uuid);

            if (token) {
                const res = await fetch(`${AUTH_API_BASE}/api/userinfo?token=${encodeURIComponent(token)}`);
                const data = await res.json();
                if (data.success && data.user) {
                    return data.user;
                }
            }

            const fallback = {
                username: '用户' + uuid.substring(0, 6),
                uuid: uuid,
                email: null,
                phone: null
            };
            return fallback;
        } catch (err) {
            console.error('获取用户信息失败:', err);
            return {
                username: '用户' + uuid.substring(0, 6),
                uuid: uuid,
                email: null,
                phone: null
            };
        }
    }

    // ========== 渲染个人主页 ==========
    function renderUserProfile(user) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'inline-block';
        document.getElementById('userInfo').style.display = 'flex';

        document.getElementById('userName').textContent = user.username || '未知用户';
        document.getElementById('userUuid').textContent = user.uuid || '';
        const avatarText = user.username ? user.username.charAt(0).toUpperCase() : 'U';
        document.getElementById('userAvatar').textContent = avatarText;
    }

    // ========== 退出登录 ==========
    document.getElementById('logoutBtn').addEventListener('click', async function(e) {
        e.preventDefault();

        const uuid = getQueryParam('uuid');
        const token = localStorage.getItem('orange_token_' + uuid);

        if (token) {
            try {
                await fetch(`${AUTH_API_BASE}/api/logout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });
            } catch (err) {
                console.error('退出登录请求失败:', err);
            }
            localStorage.removeItem('orange_token_' + uuid);
        }

        removeQueryParam('uuid');
        location.reload();
    });

    // ========== 主逻辑 ==========
    (async function main() {
        const uuid = getQueryParam('uuid');

        if (uuid) {
            const user = await fetchUserInfo(uuid);
            renderUserProfile(user);
        }
    })();
</script>

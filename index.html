<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORANGE橙子科技</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 40px 20px;
        }

        /* 顶部 LOGO */
        .header-image {
            width: 100%;
            aspect-ratio: 726 / 289;
            background-color: #f5f5f7;
            border-radius: 16px;
            margin-bottom: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 1px dashed #ddd;
        }

        .header-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }

        /* 按钮网格 */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 60px;
        }

        .btn {
            padding: 25px 10px;
            background-color: #f5f5f7;
            border: none;
            border-radius: 12px;
            color: #333;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .btn.active {
            background-color: #000000;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn.active:hover {
            transform: translateY(-5px);
            background-color: #333;
        }

        .btn.disabled {
            background-color: #f5f5f7;
            color: #bbb;
            cursor: not-allowed;
            border: 1px solid #eee;
        }

        .new-tag {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 10px;
            color: #ffffff;
            background-color: #ff4757;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: normal;
            letter-spacing: 0.5px;
        }

        /* 登录区域 */
        .login-section {
            margin-top: 40px;
        }

        .login-note {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }

        /* 底部版权 */
        .footer {
            font-size: 14px;
            color: #999;
            letter-spacing: 1px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 顶部 LOGO -->
    <div class="header-image">
        <img src="ORANGE.png" alt="ORANGE Logo">
    </div>

    <!-- 主按钮区 -->
    <div class="button-grid">
        <a href="https://orange-6lw.pages.dev/1" class="btn active" target="_blank">
            ORANUP
        </a>

        <a href="https://orange-6lw.pages.dev/1" class="btn active" target="_blank">
            作品
        </a>

        <a href="https://orange-6lw.pages.dev/" class="btn active" target="_blank">
            刷新
            <span class="new-tag">new</span>
        </a>

        <button class="btn disabled" onclick="alert('暂未开放')">
            暂未开放
        </button>
    </div>

    <!-- 登录按钮 -->
    <div class="login-section">
        <a href="http://free.frpee.top:19148/" class="btn active" target="_blank">
            登录
        </a>
        <div class="login-note">此站点不一定开放</div>
    </div>

    <!-- 底部版权 -->
    <div class="footer">
        © ORANGE 2026 版权所有 Zcloud提供技术支持
    </div>

</div>

</body>
</html>

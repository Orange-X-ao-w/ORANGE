<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORANGE跳转站</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 40px;
        }
        .jump-btn {
            padding: 18px 40px;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .jump-btn:hover {
            background-color: #333;
            transform: translateY(-3px);
        }
        /* 新增版权样式 */
        .footer {
            margin-top: 60px;
            font-size: 14px;
            color: #999;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ORANGE橙子科技工作室</h1>
        <p>点击下方按钮跳转至ORANUP页面</p>

        <!-- 新增版权信息 -->
